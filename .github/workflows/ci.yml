name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db-order-service:
        image: postgres:17.11
        env:
          POSTGRES_USER: db_user
          POSTGRES_PASSWORD: orderservice
          POSTGRES_DB: order_service
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U db_user -d order_service"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      db-notification-service:
        image: postgres:17.11
        env:
          POSTGRES_USER: db_user
          POSTGRES_PASSWORD: notificationservice
          POSTGRES_DB: notification_service
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U db_user -d notification_service"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: bash order-service/mvnw -B test

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - notification-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.IMAGE }}/${{ matrix.service }}:latest
            ${{ env.IMAGE }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
